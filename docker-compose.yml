# GhimTech Tax — local development infrastructure.
# App processes run on the host (pnpm dev); this provides Postgres and Redis.
# Full containerized runs use the app Dockerfiles (see infrastructure/).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ghimtech
      POSTGRES_PASSWORD: ghimtech_dev
      POSTGRES_DB: ghimtech_tax
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghimtech"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
